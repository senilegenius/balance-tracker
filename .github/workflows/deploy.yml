name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  audit:
    name: npm audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  test:
    name: npm test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Used by psql/createdb in scripts/setup-test-db.sh (pretest hook)
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/balance_tracker_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm test

  deploy-sandbox:
    name: Deploy to sandbox
    needs: [audit, test]
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: sandbox
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile.lambda \
            -t $ECR_REGISTRY/balance-tracker:$IMAGE_TAG \
            -t $ECR_REGISTRY/balance-tracker:latest \
            .
          docker push $ECR_REGISTRY/balance-tracker:$IMAGE_TAG
          docker push $ECR_REGISTRY/balance-tracker:latest
          echo "IMAGE_URI=$ECR_REGISTRY/balance-tracker:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure AWS credentials for Lambda deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name balance-tracker-sandbox \
            --image-uri "$IMAGE_URI"
          aws lambda wait function-updated \
            --function-name balance-tracker-sandbox

  deploy-prd:
    name: Deploy to prd
    needs: [audit, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: prd
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials for ECR push
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ECR_PUSH_ROLE_ARN }}
          aws-region: us-west-2

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          docker build --platform linux/amd64 -f Dockerfile.lambda \
            -t $ECR_REGISTRY/balance-tracker:$IMAGE_TAG \
            -t $ECR_REGISTRY/balance-tracker:latest \
            .
          docker push $ECR_REGISTRY/balance-tracker:$IMAGE_TAG
          docker push $ECR_REGISTRY/balance-tracker:latest
          echo "IMAGE_URI=$ECR_REGISTRY/balance-tracker:$IMAGE_TAG" >> "$GITHUB_ENV"

      - name: Configure AWS credentials for Lambda deploy
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name balance-tracker-prd \
            --image-uri "$IMAGE_URI"
          aws lambda wait function-updated \
            --function-name balance-tracker-prd

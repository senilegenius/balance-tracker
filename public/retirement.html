<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retirement Accounts</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow-x: hidden;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
            overflow-y: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 2rem;
        }

        /* ── Tab row with global refresh button ─────────────────────────── */
        .page-tabs-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 30px;
        }

        .page-tabs-row .tabs-left {
            display: flex;
            gap: 8px;
        }

        .btn-refresh-all {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s;
            white-space: nowrap;
        }
        .btn-refresh-all:hover    { opacity: 0.9; }
        .btn-refresh-all:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-panel-action {
            padding: 8px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: white;
            color: #2c3e50;
            transition: background 0.2s;
            white-space: nowrap;
        }
        .btn-panel-action:hover    { background: #f0f0f0; }
        .btn-panel-action:disabled { opacity: 0.6; cursor: not-allowed; }

        .tab-link {
            padding: 10px 20px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            color: #7f8c8d;
            background: white;
            border: 1px solid #e0e0e0;
            box-shadow: 0 1px 4px rgba(0,0,0,0.06);
        }

        .tab-link:hover {
            background: #f0f0f0;
            color: #2c3e50;
        }

        .tab-link.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: transparent;
        }

        /* ── Summary cards ──────────────────────────────────────────────── */
        .summary-panel {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card.primary {
            grid-column: span 4;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .card-label {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 8px;
        }

        .card-value {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 8px;
        }

        /* Per-type cards use a smaller value font */
        .card:not(.primary) .card-value,
        .type-positive {
            font-size: 1.8rem !important;
            font-weight: bold;
            color: #27ae60;
            margin-bottom: 8px;
        }

        .card-sub {
            font-size: 0.85rem;
            opacity: 0.75;
        }

        .card:not(.primary) .card-sub {
            color: #7f8c8d;
            opacity: 1;
        }

        /* ── Balances panel ─────────────────────────────────────────────── */
        .balances-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .balances-panel h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .balances-panel h2 span {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-weight: normal;
        }

        /* ── Institution sections ───────────────────────────────────────── */
        .institution {
            margin-bottom: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            overflow: hidden;
        }

        .institution-header {
            background: #f8f9fa;
            padding: 15px 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            color: #2c3e50;
            user-select: none;
        }

        .institution-header:hover {
            background: #e9ecef;
        }

        .institution-accounts {
            padding: 10px;
        }

        .institution-accounts.collapsed {
            display: none;
        }

        .chevron {
            transition: transform 0.3s;
        }

        .chevron.open {
            transform: rotate(180deg);
        }

        /* ── Account rows ───────────────────────────────────────────────── */
        .account-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 100px;
            padding: 12px 20px;
            align-items: center;
            border-bottom: 1px solid #f0f0f0;
        }

        .account-row:last-child {
            border-bottom: none;
        }

        .account-name {
            color: #2c3e50;
            font-weight: 500;
        }

        .account-type {
            color: #7f8c8d;
            font-size: 0.9rem;
        }

        /* Native USD amount shown alongside the CAD balance */
        .account-usd-note {
            text-align: right;
        }

        .currency-note {
            font-size: 0.8rem;
            color: #95a5a6;
        }

        .account-balance {
            text-align: right;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .account-balance.positive { color: #27ae60; }
        .account-balance.negative { color: #e74c3c; }

        /* ── Type tag badges ────────────────────────────────────────────── */
        .account-tag {
            text-align: right;
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            background: #f0f0f0;
            color: #7f8c8d;
        }

        .tag-401k    { background: #eafaf1; color: #1e8449; }
        .tag-ira     { background: #eaf4fb; color: #2471a3; }
        .tag-rrsp    { background: #fdf2f8; color: #9b59b6; }
        .tag-tfsa    { background: #fef9e7; color: #d68910; }
        .tag-lira    { background: #fdedec; color: #cb4335; }
        .tag-pension { background: #f4f6f7; color: #566573; }
        .tag-other   { background: #f0f0f0; color: #7f8c8d; }

        /* ── Trend chart panel ──────────────────────────────────────────── */
        .chart-panel {
            background: white;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .chart-panel h2 {
            color: #2c3e50;
            margin-bottom: 20px;
            font-size: 1.5rem;
        }

        .date-range-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .date-range-btn {
            padding: 8px 16px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .date-range-btn:hover { background: #f8f9fa; }

        .date-range-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        /* ── Balances panel header ──────────────────────────────────────── */
        .balances-panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .balances-panel-header h2 {
            margin: 0;
            color: #2c3e50;
            font-size: 1.5rem;
        }

        .balances-panel-header h2 span {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .balances-panel-actions {
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .panel-action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .panel-action-btn.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .panel-action-btn.primary:hover {
            opacity: 0.9;
        }

        .panel-action-btn.secondary {
            background: #f8f9fa;
            color: #2c3e50;
            border: 1px solid #e0e0e0;
        }

        .panel-action-btn.secondary:hover {
            background: #e9ecef;
        }

        /* ── Shared modal base ───────────────────────────────────────────── */
        .ret-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .ret-modal.show {
            display: flex;
        }

        .ret-modal-content {
            background: white;
            border-radius: 16px;
            max-width: 560px;
            width: 100%;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .ret-modal-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 16px 16px 0 0;
            position: relative;
        }

        .ret-modal-header h2 {
            margin: 0;
            font-size: 1.4rem;
        }

        .ret-modal-header p {
            margin: 6px 0 0 0;
            opacity: 0.9;
            font-size: 0.9rem;
        }

        .ret-modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }

        .ret-modal-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .ret-modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }

        .ret-modal-footer {
            padding: 20px 24px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 12px;
            justify-content: flex-end;
        }

        .ret-modal-btn {
            padding: 10px 24px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .ret-modal-btn.cancel {
            background: #f8f9fa;
            color: #2c3e50;
        }

        .ret-modal-btn.cancel:hover {
            background: #e9ecef;
        }

        .ret-modal-btn.save {
            background: #667eea;
            color: white;
        }

        .ret-modal-btn.save:hover {
            background: #5568d3;
        }

        .ret-modal-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            opacity: 0.7;
        }

        /* ── Add account form fields ─────────────────────────────────────── */
        .form-field {
            margin-bottom: 20px;
        }

        .form-field label {
            display: block;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        .form-field input,
        .form-field select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: inherit;
            color: #2c3e50;
            transition: border-color 0.2s;
        }

        .form-field input:focus,
        .form-field select:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-field input[type="number"] {
            font-family: monospace;
        }

        .form-field .field-hint {
            margin-top: 4px;
            font-size: 0.8rem;
            color: #95a5a6;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .ret-modal-error {
            background: #fdf0f0;
            border-left: 4px solid #e74c3c;
            padding: 10px 14px;
            border-radius: 4px;
            color: #c0392b;
            font-size: 0.9rem;
            margin-bottom: 16px;
            display: none;
        }

        /* ── Update balances rows ────────────────────────────────────────── */
        .update-account-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .update-account-item:last-child {
            border-bottom: none;
            margin-bottom: 0;
            padding-bottom: 0;
        }

        .update-account-name {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 2px;
        }

        .update-account-meta {
            color: #7f8c8d;
            font-size: 0.85rem;
            margin-bottom: 8px;
        }

        .update-account-input-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .update-account-input {
            flex: 1;
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
            font-family: monospace;
        }

        .update-account-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .update-account-currency {
            color: #7f8c8d;
            font-size: 0.9rem;
            font-weight: 600;
            min-width: 40px;
        }

        /* ── Responsive ─────────────────────────────────────────────────── */
        @media (max-width: 1200px) {
            .summary-panel {
                grid-template-columns: repeat(2, 1fr);
            }
            .card.primary {
                grid-column: span 2;
            }
        }

        @media (max-width: 768px) {
            .summary-panel {
                grid-template-columns: 1fr;
            }
            .card.primary {
                grid-column: span 1;
            }
            .account-row {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .account-usd-note {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏦 Retirement Accounts</h1>

        <div class="page-tabs-row">
            <div class="tabs-left">
                <a href="/index.html" class="tab-link">💵 Liquid Cash</a>
                <a href="/retirement.html" class="tab-link active">🏦 Retirement</a>
            </div>
            <button class="btn-refresh-all" id="refreshAllBtn">🔄 Refresh All Balances</button>
        </div>

        <!-- Summary cards — populated dynamically by retirement.js -->
        <div class="summary-panel" id="summaryPanel">
            <div class="card primary">
                <div class="card-label">Total Retirement (CAD)</div>
                <div class="card-value">Loading…</div>
            </div>
        </div>

        <!-- Account balances — institutions + rows populated by retirement.js -->
        <div class="balances-panel">
            <div class="balances-panel-header">
                <h2>Retirement Account Balances <span></span></h2>
                <div class="balances-panel-actions">
                    <button class="btn-panel-action" id="addAccountBtn">➕ Add Manual Account</button>
                    <button class="btn-panel-action" id="refreshRetirementBtn">🔄 Refresh Retirement Balances</button>
                </div>
            </div>
        </div>

        <!-- Add Account modal -->
        <div class="ret-modal" id="addAccountModal">
            <div class="ret-modal-content">
                <div class="ret-modal-header">
                    <button class="ret-modal-close" id="closeAddAccountBtn">×</button>
                    <h2>＋ Add Retirement Account</h2>
                    <p>Manually add an account not supported by Plaid</p>
                </div>
                <div class="ret-modal-body">
                    <div class="ret-modal-error" id="addAccountError"></div>
                    <div class="form-field">
                        <label for="addInstitution">Institution</label>
                        <input type="text" id="addInstitution" placeholder="e.g. Fidelity" autocomplete="organization">
                    </div>
                    <div class="form-field">
                        <label for="addAccountName">Account Name</label>
                        <input type="text" id="addAccountName" placeholder="e.g. Roth IRA" autocomplete="off">
                    </div>
                    <div class="form-row">
                        <div class="form-field">
                            <label for="addAccountType">Account Type</label>
                            <select id="addAccountType">
                                <option value="401k">401(k)</option>
                                <option value="403b">403(b)</option>
                                <option value="457b">457(b)</option>
                                <option value="ira">IRA</option>
                                <option value="roth" selected>Roth IRA</option>
                                <option value="roth 401k">Roth 401(k)</option>
                                <option value="rrsp">RRSP</option>
                                <option value="tfsa">TFSA</option>
                                <option value="lira">LIRA</option>
                                <option value="rrif">RRIF</option>
                                <option value="resp">RESP</option>
                                <option value="pension">Pension</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="addCurrency">Currency</label>
                            <select id="addCurrency">
                                <option value="CAD">CAD</option>
                                <option value="USD">USD</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-field">
                        <label for="addInitialBalance">Initial Balance</label>
                        <input type="number" id="addInitialBalance" placeholder="Optional" step="0.01" min="0">
                        <div class="field-hint">Leave blank to add the account with no balance history yet</div>
                    </div>
                </div>
                <div class="ret-modal-footer">
                    <button class="ret-modal-btn cancel" id="cancelAddAccountBtn">Cancel</button>
                    <button class="ret-modal-btn save" id="saveAddAccountBtn">Save Account</button>
                </div>
            </div>
        </div>

        <!-- Trend chart -->
        <div class="chart-panel">
            <h2>Retirement Trend (CAD)</h2>
            <div class="date-range-selector">
                <button class="date-range-btn" data-range="30d">30 Days</button>
                <button class="date-range-btn active" data-range="90d">90 Days</button>
                <button class="date-range-btn" data-range="6m">6 Months</button>
                <button class="date-range-btn" data-range="1y">1 Year</button>
                <button class="date-range-btn" data-range="all">All Time</button>
            </div>
            <div class="chart-container">
                <canvas id="retirementTrendChart"></canvas>
            </div>
        </div>
    </div>

    <script src="/js/refresh-modal.js"></script>
    <script src="/js/retirement.js"></script>
</body>
</html>
